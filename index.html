<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Unchained — a mobile-first chat client for the abliteration.ai API">
<title>Unchained</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101318'/%3E%3Cpath d='M18 44 L32 16 L46 44 M23 35 H41' stroke='%237cc4ff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
/* ===================== Design tokens ===================== */
:root{
  --bg:#0f1115; --bg-2:#161a21; --bg-3:#1e232c; --bg-4:#262c37;
  --fg:#e9ecf1; --fg-2:#b3bac6; --fg-3:#7f8795;
  --line:#2a303b; --accent:#7cc4ff; --accent-fg:#06233a; --accent-2:#3b82f6;
  --user:#243246; --assistant:#161a21; --danger:#ff6b6b; --warn:#ffbf47; --ok:#4ade80;
  --code:#0b0d11; --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:14px; --tap:44px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --vvh:100dvh;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --bg-2:#ffffff; --bg-3:#eef1f5; --bg-4:#e3e7ed;
  --fg:#161a21; --fg-2:#3f4752; --fg-3:#6b7380;
  --line:#d8dde5; --accent:#1d6fd6; --accent-fg:#ffffff; --accent-2:#1d6fd6;
  --user:#dbeafe; --assistant:#ffffff; --danger:#c62828; --warn:#a15c00; --ok:#1b7f3b;
  --code:#f0f2f5; --shadow:0 10px 30px rgba(0,0,0,.15);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ===================== App shell ===================== */
#app{display:flex;flex-direction:column;height:var(--vvh);max-height:100dvh;width:100%;position:fixed;inset:0 auto auto 0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:4px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);background:var(--bg-2);border-bottom:1px solid var(--line);min-height:calc(var(--sat) + 56px);flex:none}
.iconbtn{min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--fg-2)}
.iconbtn:active{background:var(--bg-4)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar .title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:2px 4px}
.topbar .titlebtn{max-width:100%;padding:2px 4px;border-radius:8px;text-align:left;min-height:24px}
.topbar .title b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:3px;max-width:100%;min-height:24px;padding:1px 8px;border-radius:999px;background:var(--bg-3);border:1px solid var(--line);color:var(--fg-2);font-size:12px;white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip:active{background:var(--bg-4)}
.modellist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:56px;padding:8px 10px;border-radius:12px;text-align:left;border:1px solid transparent}
.modellist button.current{border-color:var(--accent);background:var(--bg-3)}
.modellist b{font-weight:600;font-size:14px;word-break:break-all}
.modellist small{color:var(--fg-3);font-size:12px}
.meter{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:36px;border-radius:999px;background:var(--bg-3);font-size:12px;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.meter .bar{width:34px;height:6px;border-radius:3px;background:var(--bg-4);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok);width:0}
.meter.warn .bar i{background:var(--warn)} .meter.block .bar i{background:var(--danger)}
.meter.warn{border-color:var(--warn)} .meter.block{border-color:var(--danger)}

.banner{background:var(--warn);color:#1a1200;padding:10px 14px;font-size:14px;flex:none}
.banner.info{background:var(--accent-2);color:#fff}
.banner button{text-decoration:underline;font-weight:600;margin-left:8px;color:inherit}

/* ===================== Messages ===================== */
#messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px calc(var(--sar) + 10px) 16px calc(var(--sal) + 10px);scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){#messages{scroll-behavior:auto}}
.empty{max-width:420px;margin:12vh auto 0;text-align:center;color:var(--fg-2);padding:0 16px}
.empty h2{font-size:22px;margin:0 0 8px;color:var(--fg)}
.empty p{margin:0 0 14px}
.empty .btn{margin:4px}
.divider{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12px;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{content-visibility:auto;contain-intrinsic-size:auto 120px;margin:0 0 14px;display:flex;flex-direction:column;max-width:100%}
.msg.user{align-items:flex-end}
.msg.notsent{opacity:.55}
.bubble{position:relative;max-width:min(92%,760px);border-radius:var(--radius);padding:10px 14px;background:var(--assistant);border:1px solid var(--line);overflow-wrap:anywhere;word-break:break-word}
.msg.user .bubble{background:var(--user);border-color:transparent}
.msg.assistant .bubble{width:100%}
.bubble .md>:first-child{margin-top:0} .bubble .md>:last-child{margin-bottom:0}
.md p{margin:.5em 0} .md ul,.md ol{padding-left:1.4em;margin:.5em 0} .md li{margin:.15em 0}
.md h1,.md h2,.md h3,.md h4{margin:.8em 0 .4em;line-height:1.3} .md h1{font-size:1.35em} .md h2{font-size:1.2em} .md h3{font-size:1.08em}
.md blockquote{border-left:3px solid var(--accent);margin:.5em 0;padding:.1em .8em;color:var(--fg-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:.92em;margin:.5em 0}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md img{max-width:100%;border-radius:8px}
.md code{font-family:var(--mono);font-size:.9em;background:var(--code);padding:.12em .35em;border-radius:5px}
.md pre{margin:.6em 0;background:var(--code);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.md pre code{display:block;padding:10px 12px;overflow-x:auto;background:none;font-size:.86em;line-height:1.45}
.codebar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 2px 12px;font-size:12px;color:var(--fg-3);background:var(--bg-3);border-bottom:1px solid var(--line);font-family:var(--mono)}
.codebar button{min-height:32px;padding:0 10px;border-radius:8px;color:var(--fg-2);font-family:var(--font)}
.plain{white-space:pre-wrap}
.think{margin:0 0 8px;border:1px dashed var(--line);border-radius:10px;background:var(--bg-3);font-size:14px}
.think summary{cursor:pointer;padding:8px 12px;color:var(--fg-2);list-style:none;display:flex;align-items:center;gap:8px;min-height:40px}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"▸";transition:transform .15s} .think[open] summary::before{transform:rotate(90deg)}
.think .body{padding:0 12px 10px;color:var(--fg-2);white-space:pre-wrap;max-height:50vh;overflow:auto;font-size:13px}
.attachments{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.attachments img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.actions{display:flex;align-items:center;gap:2px;margin-top:4px;flex-wrap:wrap;color:var(--fg-3);font-size:12px}
.msg.user .actions{justify-content:flex-end}
.actions button{min-height:36px;min-width:36px;padding:0 8px;border-radius:9px;color:var(--fg-3);display:inline-flex;align-items:center;gap:4px}
.actions button:active{background:var(--bg-3)}
.actions svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions .nav{display:inline-flex;align-items:center;gap:0;font-variant-numeric:tabular-nums}
.actions .nav span{min-width:38px;text-align:center}
.meta{font-size:11px;color:var(--fg-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.msg.user .meta{justify-content:flex-end}
.bubble.error{border-color:var(--danger)}
.errline{color:var(--danger);font-size:13px;margin:6px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cursor::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
#jump{position:absolute;right:calc(var(--sar) + 14px);bottom:calc(var(--composer-h,80px) + 14px);width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;z-index:5}
#jump svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ===================== Composer ===================== */
.composer{flex:none;padding:8px calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);background:var(--bg-2);border-top:1px solid var(--line)}
.composer .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.composer .thumbs div{position:relative}
.composer .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.composer .thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font-size:14px;line-height:1}
.composer .row{display:flex;align-items:flex-end;gap:6px}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg-3);border-radius:18px;padding:11px 14px;min-height:44px;max-height:40vh;line-height:1.4;font-size:16px}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sendbtn:disabled{opacity:.45;cursor:default}
.sendbtn.stop{background:var(--danger);color:#fff}
.sendbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:11px;color:var(--fg-3);text-align:center;margin-top:4px}

/* ===================== Drawer ===================== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--bg-2);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;z-index:21;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:6px;padding:8px 8px 6px}
.drawer header h1{font-size:18px;margin:0;flex:1;padding-left:6px}
.drawer .search{padding:0 10px 8px}
.drawer .search input{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg-3);padding:0 12px}
.drawer .newchat{margin:0 10px 8px;min-height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.drawer .newchat svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.chatlist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 6px}
.chatlist .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);padding:10px 10px 4px}
.chatitem{display:flex;align-items:center;gap:4px;border-radius:12px;padding:2px 2px 2px 10px;min-height:52px}
.chatitem.active{background:var(--bg-3)}
.chatitem .main{flex:1;min-width:0;text-align:left;padding:6px 0}
.chatitem .main b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .main small{display:block;color:var(--fg-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .pin{color:var(--warn);font-size:12px;margin-right:4px}
.drawer footer{padding:6px 8px;border-top:1px solid var(--line);display:flex;gap:4px}
.drawer footer .iconbtn{flex:1;gap:8px;font-size:14px;border-radius:12px}

/* ===================== Sheets / dialogs / panels ===================== */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.sheet-wrap.show{display:flex}
.sheet{background:var(--bg-2);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;padding:8px 16px calc(var(--sab) + 16px);border:1px solid var(--line);box-shadow:var(--shadow);overscroll-behavior:contain}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:17px;margin:4px 0 10px}
.sheet p{color:var(--fg-2);font-size:14px;margin:6px 0}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 8px;border-radius:12px;text-align:left;font-size:15px}
.menu button:active{background:var(--bg-3)}
.menu button.danger{color:var(--danger)}
.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.panel{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:var(--sat)}
.panel.show{display:flex}
.panel>header{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-2);flex:none}
.panel>header h2{font-size:17px;margin:0;flex:1}
.panel>.body{flex:1;overflow-y:auto;padding:12px 16px calc(var(--sab) + 24px);overscroll-behavior:contain;padding-left:calc(var(--sal) + 16px);padding-right:calc(var(--sar) + 16px)}
.panel .body h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);margin:22px 0 8px}
.panel .body h3:first-child{margin-top:4px}
.panel .body p,.panel .body li{font-size:14px;color:var(--fg-2)}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.field>label,.field>.lbl{font-size:13px;color:var(--fg-2)}
.field .help{font-size:12px;color:var(--fg-3)}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=url],.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg-3);border-radius:10px;padding:8px 12px;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.field .inline{display:flex;gap:6px;align-items:center}
.field .inline input{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--line)}
.switch .t{font-size:15px} .switch .d{font-size:12px;color:var(--fg-3)}
.switch input{width:48px;height:28px;appearance:none;border-radius:14px;background:var(--bg-4);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line);font-weight:500;font-size:15px}
.btn:active{background:var(--bg-4)} .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)} .btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.btnrow .btn{flex:1 1 auto}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.card.ok{border-color:var(--ok)} .card.bad{border-color:var(--danger)} .card.warn{border-color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{font-weight:500;color:var(--fg-2)}
.mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:50vh;overflow:auto}
.steps{padding-left:1.3em} .steps li{margin:.35em 0}
table.prices{width:100%;border-collapse:collapse;font-size:13px}
table.prices td,table.prices th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.prices input{width:100%;min-height:40px;border:1px solid var(--line);background:var(--bg-3);border-radius:8px;padding:0 8px;font-size:15px}
.reqlog{font-size:12px;font-family:var(--mono);display:grid;gap:4px}
.reqlog div{padding:6px 8px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
.reqlog .bad{border-color:var(--danger)}

/* ===================== Toasts ===================== */
#toasts{position:fixed;left:50%;bottom:calc(var(--composer-h,80px) + var(--sab) + 12px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;background:var(--bg-4);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:14px;animation:up .18s ease}
.toast.err{border-color:var(--danger)} .toast.ok{border-color:var(--ok)}
.toast span{flex:1}
.toast button{min-height:36px;padding:0 10px;border-radius:8px;color:var(--accent);font-weight:600}
@keyframes up{from{transform:translateY(10px);opacity:0}}
dialog{background:var(--bg-2);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:min(92vw,480px);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-size:17px;margin:0 0 8px} dialog p{color:var(--fg-2);font-size:14px;margin:0 0 12px}
dialog .btnrow{margin:14px 0 0;justify-content:flex-end}
dialog input[type=text],dialog textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg-3);border-radius:10px;padding:8px 12px;font-size:16px}
@media (hover:hover){.iconbtn:hover,.actions button:hover,.menu button:hover,.chatitem:hover{background:var(--bg-3)}}
@media (min-width:900px){.bubble{max-width:min(86%,820px)}#messages{padding-left:max(10px,calc(50vw - 440px));padding-right:max(10px,calc(50vw - 440px))}}

/* ===================== Code highlighting (self-contained theme) ===================== */
.hljs-comment,.hljs-quote{color:#8b949e;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,.hljs-link{color:#ff7b72}
.hljs-string,.hljs-attr,.hljs-template-tag,.hljs-addition{color:#a5d6ff}
.hljs-number,.hljs-regexp,.hljs-meta,.hljs-symbol{color:#79c0ff}
.hljs-title,.hljs-name,.hljs-type,.hljs-built_in,.hljs-class .hljs-title{color:#d2a8ff}

<script type="module">
/* =====================================================================
 *  ABLI CHAT — application module
 *  Sections: constants · util · store · tokens · api · render · sessions ·
 *            settings · diagnostics · ui
 *  Everything below is plain ES2020+, unminified on purpose so it can be
 *  edited later from a phone. Vendored libraries (marked, DOMPurify,
 *  highlight.js) are in the classic <script> at the end of the file and are
 *  exposed as window.AbliVendor.
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 1. CONSTANTS
 * ------------------------------------------------------------------- */
const APP_VERSION = '1.0.0';
const BUILD_DATE = '2026-10-25 17:14 UTC';
const DEFAULT_BASE_URL = 'https://api.abliteration.ai/v1';
const DB_NAME = 'abli-chat';
const DB_VERSION = 1;
const CHARS_PER_TOKEN = 4;          // local estimate
const IMAGE_TOKENS = 1100;          // rough per-image estimate
const MSG_OVERHEAD_TOKENS = 4;      // per-message framing overhead
const WARN_RATIO = 0.8;             // context meter warns here
const MAX_IMAGES = 6;
const IMAGE_MAX_PX = 1600;
const REQUEST_LOG_LIMIT = 20;
const ERROR_LOG_LIMIT = 30;

/** Known models (fallback when GET /v1/models is unavailable; also supplies capabilities). */
const KNOWN_MODELS = {
  'abliterated-model-large-v2':    { context: 1000000, maxOutput: 999990, images: false, reasoning: 'always',   note: 'Recommended' },
  'abliterated-model-large-flash': { context: 1048576, maxOutput: 262144, images: true,  reasoning: 'optional', note: 'Fast, images' },
  'abliterated-model':             { context: 262144,  maxOutput: 262134, images: true,  reasoning: 'optional', note: 'Images' },
  'abliterated-model-large':       { context: 1000000, maxOutput: 999990, images: false, reasoning: 'optional', note: 'Deprecated', deprecated: true },
};
/** Short display name for the header chip. */
function shortModel(id) { return id === 'abliterated-model' ? 'abli-base' : String(id || '').replace('abliterated-model-', 'abli-'); }
const UNKNOWN_MODEL = { context: 262144, maxOutput: 65536, images: false, reasoning: 'optional', note: 'Unknown capabilities (defaults)', unknown: true };

const DEFAULT_SETTINGS = {
  baseUrl: DEFAULT_BASE_URL,
  mode: 'direct',                  // 'direct' | 'relay'
  relayUrl: '',
  model: 'abliterated-model-large-v2',
  systemPrompt: '',
  reasoningEffort: 'default',      // 'default' | 'none' | 'low' | 'medium' | 'high'
  temperature: 0.7,
  maxOutputTokens: 0,              // 0 = auto (model max, clamped to the window)
  showThinking: true,
  titleMode: 'model',              // 'model' | 'truncate'
  titleModel: 'abliterated-model',
  autoTrim: false,
  exactCount: false,               // use /v1/messages/count_tokens
  sendOnEnter: 'auto',             // 'auto' | 'always' | 'never'
  theme: 'dark',
  noStreamOptions: false,          // learned: API rejects stream_options
  prices: {},                      // modelId -> { input: $/M, output: $/M }
  modelCache: null,                // last successful /v1/models result
  defaultNoteSeen: false,          // one-time note about the recommended default model
};

/* ---------------------------------------------------------------------
 * 2. UTIL
 * ------------------------------------------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const now = () => Date.now();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const isTouch = () => matchMedia('(hover: none) and (pointer: coarse)').matches;
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtK(n) {
  n = Math.max(0, Math.round(n || 0));
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 2).replace(/\.?0+$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k';
  return String(n);
}
function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
function fmtMoney(usd) {
  if (!isFinite(usd)) return '—';
  if (usd < 0.01) return '$' + usd.toFixed(4);
  return '$' + usd.toFixed(usd < 1 ? 3 : 2);
}
function fmtTime(ts) { return new Date(ts).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' }); }
function fmtBytes(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function haptic(ms = 10) { try { if (navigator.vibrate && isTouch()) navigator.vibrate(ms); } catch (e) { /* ignore */ } }
function download(filename, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function safeFilename(s) { return String(s || 'chat').replace(/[^\w\- ]+/g, '').trim().slice(0, 60) || 'chat'; }

/* ---- Secret redaction: every piece of text that leaves the app (screen, clipboard,
 *      diagnostics, stored error bodies) passes through redact(). ---- */
const Secrets = { apiKey: '', relayToken: '' };
function redact(text) {
  let s = String(text ?? '');
  for (const v of [Secrets.apiKey, Secrets.relayToken]) {
    if (v && v.length >= 6) s = s.split(v).join('[REDACTED]');
  }
  // Belt and braces: bearer tokens and key-looking strings that slipped through.
  s = s.replace(/Bearer\s+[A-Za-z0-9._\-]{12,}/g, 'Bearer [REDACTED]');
  s = s.replace(/\b(sk|ak|abl)[-_][A-Za-z0-9._\-]{16,}/g, '[REDACTED]');
  return s;
}
async function copyText(text, label = 'Copied') {
  const safe = redact(text);
  try {
    await navigator.clipboard.writeText(safe);
    toast(label, 'ok');
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = safe; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      toast(label, 'ok');
      return true;
    } catch (e2) { toast('Copy failed', 'err'); return false; }
  }
}
/** Copies a real secret (relay token) to the clipboard — the one place redaction must not apply. */
async function copySecret(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label, 'ok'); return true; }
  catch (e) { toast('Clipboard blocked — long-press the token field to copy', 'err'); return false; }
}

/* ---------------------------------------------------------------------
 * 3. STORE — IndexedDB
 *    chats    : { id, title, titleAuto, pinned, createdAt, updatedAt, preview, msgCount, settings, totals }
 *    trees    : { id (=chatId), nodes:{...}, head, sendFrom }
 *    settings : { key, value }   (key 'global')
 *    secrets  : { key, value }   (apiKey, relayToken) — never exported, never logged
 *    diag     : { key, value }   (requests, errors)
 * ------------------------------------------------------------------- */
const Store = (() => {
  let dbp = null;
  const memory = { chats: new Map(), trees: new Map(), settings: new Map(), secrets: new Map(), diag: new Map() };
  let usingMemory = false;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { usingMemory = true; return resolve(null); }
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { usingMemory = true; return resolve(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('chats')) db.createObjectStore('chats', { keyPath: 'id' }).createIndex('updatedAt', 'updatedAt');
        if (!db.objectStoreNames.contains('trees')) db.createObjectStore('trees', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('secrets')) db.createObjectStore('secrets', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('diag')) db.createObjectStore('diag', { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { usingMemory = true; Diag.error('IndexedDB open failed: ' + (req.error && req.error.message)); resolve(null); };
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    });
    return dbp;
  }
  function tx(db, store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      let result;
      try { result = fn(s); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('aborted'));
    });
  }
  async function get(store, key) {
    const db = await open();
    if (!db) return memory[store].get(key) ?? null;
    const r = await tx(db, store, 'readonly', (s) => s.get(key));
    return r ?? null;
  }
  async function put(store, value) {
    const db = await open();
    if (!db) { memory[store].set(value.id ?? value.key, value); return; }
    await tx(db, store, 'readwrite', (s) => s.put(value));
  }
  async function del(store, key) {
    const db = await open();
    if (!db) { memory[store].delete(key); return; }
    await tx(db, store, 'readwrite', (s) => s.delete(key));
  }
  async function getAll(store) {
    const db = await open();
    if (!db) return [...memory[store].values()];
    return (await tx(db, store, 'readonly', (s) => s.getAll())) || [];
  }
  async function clear(store) {
    const db = await open();
    if (!db) { memory[store].clear(); return; }
    await tx(db, store, 'readwrite', (s) => s.clear());
  }
  /** Iterate a store with a cursor (used for content search without loading everything at once). */
  async function each(store, fn) {
    const db = await open();
    if (!db) { for (const v of memory[store].values()) { if (fn(v) === false) break; } return; }
    await new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readonly');
      const req = t.objectStore(store).openCursor();
      req.onsuccess = () => {
        const c = req.result;
        if (!c) return resolve();
        if (fn(c.value) === false) return resolve();
        c.continue();
      };
      req.onerror = () => reject(req.error);
    });
  }
  async function estimate() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        let persisted = null;
        try { persisted = navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (x) { /* ignore */ }
        return { usage: e.usage || 0, quota: e.quota || 0, persisted };
      }
    } catch (e) { /* ignore */ }
    return { usage: 0, quota: 0, persisted: null };
  }
  async function requestPersist() {
    try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) { /* ignore */ }
    return false;
  }
  return { open, get, put, del, getAll, clear, each, estimate, requestPersist, isMemory: () => usingMemory };
})();

/** Settings (global) + secrets, cached in memory. */
const Settings = {
  data: { ...DEFAULT_SETTINGS },
  async load() {
    const rec = await Store.get('settings', 'global');
    this.data = { ...DEFAULT_SETTINGS, ...(rec && rec.value ? rec.value : {}) };
    const k = await Store.get('secrets', 'apiKey');
    const t = await Store.get('secrets', 'relayToken');
    Secrets.apiKey = (k && k.value) || '';
    Secrets.relayToken = (t && t.value) || '';
    return this.data;
  },
  async save(patch = {}) {
    Object.assign(this.data, patch);
    await Store.put('settings', { key: 'global', value: this.data });
  },
  async setSecret(name, value) {
    Secrets[name] = value || '';
    await Store.put('secrets', { key: name, value: value || '' });
  },
};

/* ---------------------------------------------------------------------
 * 4. TOKENS — estimation (Web Worker from a Blob), exact counting, clamping
 * ------------------------------------------------------------------- */
const Tokens = (() => {
  const workerSrc = `
    const CPT = ${CHARS_PER_TOKEN}, IMG = ${IMAGE_TOKENS}, OVH = ${MSG_OVERHEAD_TOKENS};
    function est(text, images) {
      let t = OVH + Math.ceil((text || '').length / CPT);
      // code and non-ASCII text tokenize less efficiently: small correction
      const nonAscii = (text || '').match(/[^\\x00-\\x7F]/g);
      if (nonAscii) t += Math.ceil(nonAscii.length / 2);
      t += (images || 0) * IMG;
      return t;
    }
    self.onmessage = (e) => {
      const { id, items } = e.data;
      const out = items.map((it) => est(it.text, it.images));
      self.postMessage({ id, out });
    };`;
  let worker = null, seq = 0;
  const pending = new Map();
  function getWorker() {
    if (worker !== null) return worker;
    try {
      const url = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
      worker = new Worker(url);
      worker.onmessage = (e) => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); p(e.data.out); } };
      worker.onerror = () => { worker = false; for (const [, p] of pending) p(null); pending.clear(); };
    } catch (e) { worker = false; }
    return worker;
  }
  /** Synchronous single estimate (used for drafts and small pieces). */
  function estimateText(text, images = 0) {
    let t = MSG_OVERHEAD_TOKENS + Math.ceil((text || '').length / CHARS_PER_TOKEN);
    const nonAscii = (text || '').match(/[^\x00-\x7F]/g);
    if (nonAscii) t += Math.ceil(nonAscii.length / 2);
    return t + images * IMAGE_TOKENS;
  }
  /** Batch estimate in the worker (falls back to main thread). Returns array of token counts. */
  async function estimateMany(items) {
    const w = getWorker();
    if (!w) return items.map((it) => estimateText(it.text, it.images));
    const id = ++seq;
    const result = await new Promise((resolve) => { pending.set(id, resolve); w.postMessage({ id, items }); });
    return result || items.map((it) => estimateText(it.text, it.images));
  }
  /** Output clamp: never let input + output exceed the window. */
  function clampOutput(model, inputTokens, requested, estimated) {
    const cap = Models.caps(model);
    const margin = estimated ? Math.max(4096, Math.round(cap.context * 0.03)) : 1024;
    const room = cap.context - inputTokens - margin;
    const want = requested > 0 ? Math.min(requested, cap.maxOutput) : cap.maxOutput;
    return { maxTokens: Math.max(0, Math.min(want, room)), room, margin };
  }
  return { estimateText, estimateMany, clampOutput };
})();

/** Model catalogue: live list merged with the known table. */
const Models = {
  list: [],         // [{id, ...caps}]
  caps(id) { return KNOWN_MODELS[id] || (this.list.find((m) => m.id === id)) || { id, ...UNKNOWN_MODEL }; },
  all() {
    const ids = new Set([...Object.keys(KNOWN_MODELS), ...this.list.map((m) => m.id)]);
    return [...ids].map((id) => ({ id, ...this.caps(id) }));
  },
  setLive(ids) {
    this.list = ids.map((id) => ({ id, ...(KNOWN_MODELS[id] || UNKNOWN_MODEL) }));
  },
  largerThan(id) {
    const c = this.caps(id).context;
    return this.all().filter((m) => m.context > c && !m.deprecated);
  },
};

/* ---------------------------------------------------------------------
 * 5. API — OpenAI-compatible client with SSE streaming, request logging,
 *          stream_options fallback and CORS diagnosis.
 * ------------------------------------------------------------------- */
class ApiError extends Error {
  constructor(message, { status = 0, body = '', kind = 'error', endpoint = '' } = {}) {
    super(message); this.status = status; this.body = redact(body); this.kind = kind; this.endpoint = endpoint;
  }
}
const Api = (() => {
  function baseUrl() {
    const s = Settings.data;
    let u = (s.mode === 'relay' ? s.relayUrl : s.baseUrl) || DEFAULT_BASE_URL;
    u = u.trim().replace(/\/+$/, '');
    if (s.mode === 'relay' && !/\/v1$/.test(u)) u += '/v1';
    return u;
  }
  function authToken() { return Settings.data.mode === 'relay' ? Secrets.relayToken : Secrets.apiKey; }
  function headers(json = true) {
    const h = { Authorization: 'Bearer ' + authToken() };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }
  /** Classify a thrown fetch error: CORS vs network, using a no-cors probe. */
  async function classifyNetworkError(url) {
    if (navigator.onLine === false) return 'offline';
    try {
      await fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' });
      return 'cors';        // reachable, but the browser refused to expose the response
    } catch (e) {
      return 'network';
    }
  }
  async function readError(res) {
    let body = '';
    try { body = await res.text(); } catch (e) { /* ignore */ }
    let msg = 'HTTP ' + res.status;
    try { const j = JSON.parse(body); msg = (j.error && (j.error.message || j.error)) || j.message || j.detail || msg; if (typeof msg !== 'string') msg = JSON.stringify(msg); } catch (e) { if (body && body.length < 200) msg += ': ' + body; }
    let kind = 'http';
    if (res.status === 401 || res.status === 403) kind = 'auth';
    else if (res.status === 429) kind = 'ratelimit';
    else if (res.status >= 500) kind = 'server';
    return new ApiError(redact(msg), { status: res.status, body: body.slice(0, 4000), kind });
  }

  /** GET /v1/models → array of ids. */
  async function listModels({ signal } = {}) {
    const url = baseUrl() + '/models';
    const log = Diag.beginRequest('/v1/models', '');
    try {
      const res = await fetch(url, { headers: headers(false), signal, cache: 'no-store' });
      log.first();
      if (!res.ok) { const err = await readError(res); log.end({ status: res.status, error: err.message }); throw err; }
      const j = await res.json();
      const ids = (j.data || j.models || []).map((m) => (typeof m === 'string' ? m : m.id)).filter(Boolean);
      log.end({ status: res.status });
      return ids;
    } catch (e) {
      if (e instanceof ApiError) throw e;
      if (e.name === 'AbortError') throw new ApiError('Cancelled', { kind: 'abort' });
      const cls = await classifyNetworkError(url);
      const err = new ApiError(cls === 'cors' ? 'Blocked by the browser (CORS)' : cls === 'offline' ? 'You are offline' : 'Network error: ' + e.message, { kind: cls, body: String(e && e.stack || e) });
      log.end({ status: 0, error: err.message });
      throw err;
    }
  }

  /** Test connection: returns {ok, kind, message, models} without throwing. */
  async function testConnection() {
    if (!authToken()) return { ok: false, kind: 'nokey', message: Settings.data.mode === 'relay' ? 'No relay token entered.' : 'No API key entered.' };
    try {
      const ids = await listModels();
      Models.setLive(ids);
      await Settings.save({ modelCache: ids });
      return { ok: true, kind: 'ok', message: 'Connected. ' + ids.length + ' model' + (ids.length === 1 ? '' : 's') + ' available.', models: ids };
    } catch (e) {
      const map = {
        auth: 'The API rejected the key (HTTP ' + e.status + '). Check it in Settings.',
        cors: 'Blocked by the browser (CORS). The API is reachable but does not allow web pages to call it directly — switch to Relay mode (see Help).',
        network: 'Network error — the API could not be reached. Check your connection or the base URL.',
        offline: 'You are offline.',
        ratelimit: 'Rate limited (HTTP 429). Try again in a moment.',
        server: 'The API returned a server error (HTTP ' + e.status + ').',
      };
      return { ok: false, kind: e.kind, message: map[e.kind] || e.message, error: e };
    }
  }

  /** Build the OpenAI-style messages array for a path of nodes. */
  function buildMessages(nodes, chatSettings, model) {
    const caps = Models.caps(model);
    const out = [];
    const sys = (chatSettings.systemPrompt || '').trim();
    if (sys) out.push({ role: 'system', content: sys });
    for (const n of nodes) {
      if (n.role === 'user' && n.images && n.images.length && caps.images) {
        const parts = [];
        if (n.content) parts.push({ type: 'text', text: n.content });
        for (const img of n.images) parts.push({ type: 'image_url', image_url: { url: img } });
        out.push({ role: 'user', content: parts });
      } else {
        let text = n.content || '';
        if (n.role === 'user' && n.images && n.images.length && !caps.images) text += '\n\n[' + n.images.length + ' image(s) omitted: this model does not accept images]';
        out.push({ role: n.role, content: text });
      }
    }
    return out;
  }

  /** Build the request body. */
  function buildBody(messages, chatSettings, model, maxTokens, stream) {
    const caps = Models.caps(model);
    const body = { model, messages, stream };
    if (chatSettings.temperature !== null && chatSettings.temperature !== undefined && chatSettings.temperature !== '') body.temperature = Number(chatSettings.temperature);
    if (maxTokens > 0) body.max_tokens = maxTokens;
    const effort = chatSettings.reasoningEffort || 'default';
    if (effort !== 'default' && caps.reasoning !== 'always') body.reasoning_effort = effort;
    if (caps.reasoning !== 'none') body.include_reasoning = !!Settings.data.showThinking;
    if (stream && !Settings.data.noStreamOptions) body.stream_options = { include_usage: true };
    return body;
  }

  /** Parse one SSE event stream, calling onDelta({content, reasoning}) and returning {usage, finish}. */
  async function readSSE(res, onDelta, signal) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', usage = null, finish = null, model = null;
    const handle = (raw) => {
      const data = raw.trim();
      if (!data || data === '[DONE]') return;
      let j; try { j = JSON.parse(data); } catch (e) { return; }
      if (j.usage) usage = j.usage;
      if (j.model) model = j.model;
      if (j.error) throw new ApiError(redact(j.error.message || JSON.stringify(j.error)), { body: data, kind: 'stream' });
      const ch = j.choices && j.choices[0];
      if (!ch) return;
      if (ch.finish_reason) finish = ch.finish_reason;
      const d = ch.delta || ch.message || {};
      const content = typeof d.content === 'string' ? d.content : '';
      const reasoning = (typeof d.reasoning_content === 'string' && d.reasoning_content) || (typeof d.reasoning === 'string' && d.reasoning) || '';
      if (content || reasoning) onDelta({ content, reasoning });
    };
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).replace(/\r$/, '');
        buf = buf.slice(idx + 1);
        if (line.startsWith('data:')) handle(line.slice(5));
      }
    }
    if (buf.startsWith('data:')) handle(buf.slice(5));
    return { usage, finish, model };
  }

  /**
   * Chat completion with streaming. onDelta is called for each delta.
   * Returns { usage, finish, ttfb, duration }.
   * Automatically retries once without stream_options if the API rejects them.
   */
  async function chat({ messages, chatSettings, model, maxTokens, onDelta, signal, stream = true }) {
    const url = baseUrl() + '/chat/completions';
    let triedWithout = Settings.data.noStreamOptions;
    for (let attempt = 0; attempt < 2; attempt++) {
      const body = buildBody(messages, chatSettings, model, maxTokens, stream);
      const log = Diag.beginRequest('/v1/chat/completions', model);
      let res;
      try {
        res = await fetch(url, { method: 'POST', headers: headers(), body: JSON.stringify(body), signal });
      } catch (e) {
        if (e.name === 'AbortError') { log.end({ status: 0, error: 'stopped' }); throw new ApiError('Stopped', { kind: 'abort' }); }
        const cls = await classifyNetworkError(url);
        const err = new ApiError(cls === 'cors' ? 'Blocked by the browser (CORS) — switch to relay mode in Settings' : cls === 'offline' ? 'You are offline' : 'Network error: ' + e.message, { kind: cls, body: String(e && e.stack || e) });
        log.end({ status: 0, error: err.message });
        throw err;
      }
      log.first();
      if (!res.ok) {
        const err = await readError(res);
        const mentionsStreamOptions = /stream_options|include_usage/i.test(err.body) && res.status < 500;
        if (mentionsStreamOptions && !triedWithout && stream) {
          triedWithout = true;
          await Settings.save({ noStreamOptions: true });
          log.end({ status: res.status, error: 'stream_options rejected — retrying without' });
          continue;
        }
        log.end({ status: res.status, error: err.message });
        throw err;
      }
      try {
        let result;
        if (stream && /text\/event-stream/i.test(res.headers.get('content-type') || '')) {
          result = await readSSE(res, onDelta, signal);
        } else {
          const j = await res.json();
          const m = (j.choices && j.choices[0] && j.choices[0].message) || {};
          onDelta({ content: m.content || '', reasoning: m.reasoning_content || m.reasoning || '' });
          result = { usage: j.usage || null, finish: j.choices && j.choices[0] && j.choices[0].finish_reason, model: j.model };
        }
        const meta = log.end({ status: res.status, tokens: result.usage ? { input: result.usage.prompt_tokens, output: result.usage.completion_tokens } : null });
        return { ...result, ttfb: meta.ttfb, duration: meta.duration };
      } catch (e) {
        if (e.name === 'AbortError') { log.end({ status: res.status, error: 'stopped' }); throw new ApiError('Stopped', { kind: 'abort' }); }
        if (e instanceof ApiError) { log.end({ status: res.status, error: e.message }); throw e; }
        const err = new ApiError('Stream interrupted: ' + e.message, { kind: 'stream', body: String(e && e.stack || e) });
        log.end({ status: res.status, error: err.message });
        throw err;
      }
    }
    throw new ApiError('Request failed', { kind: 'error' });
  }

  /** Non-streaming helper for small utility calls (titles, summaries). */
  async function complete({ messages, model, maxTokens, reasoningOff = true, signal }) {
    let text = '';
    await chat({
      messages, model, maxTokens, signal, stream: false,
      chatSettings: { temperature: 0.3, reasoningEffort: reasoningOff ? 'none' : 'default' },
      onDelta: (d) => { text += d.content; },
    });
    return text.trim();
  }

  /** POST /v1/messages/count_tokens (Anthropic format). Returns input_tokens. */
  async function countTokens({ messages, model, signal }) {
    const url = baseUrl() + '/messages/count_tokens';
    const sys = messages.filter((m) => m.role === 'system').map((m) => m.content).join('\n');
    const rest = messages.filter((m) => m.role !== 'system').map((m) => ({
      role: m.role,
      content: typeof m.content === 'string' ? m.content : m.content.map((p) => (p.type === 'text' ? { type: 'text', text: p.text } : { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: String(p.image_url.url).split(',')[1] || '' } })),
    }));
    const body = { model, messages: rest };
    if (sys) body.system = sys;
    const log = Diag.beginRequest('/v1/messages/count_tokens', model);
    try {
      const res = await fetch(url, { method: 'POST', headers: { ...headers(), 'anthropic-version': '2023-06-01' }, body: JSON.stringify(body), signal });
      log.first();
      if (!res.ok) { const err = await readError(res); log.end({ status: res.status, error: err.message }); throw err; }
      const j = await res.json();
      log.end({ status: res.status, tokens: { input: j.input_tokens } });
      return Number(j.input_tokens);
    } catch (e) {
      if (e instanceof ApiError) throw e;
      log.end({ status: 0, error: e.message });
      throw new ApiError('Token count failed: ' + e.message, { kind: 'network' });
    }
  }

  return { baseUrl, listModels, testConnection, buildMessages, chat, complete, countTokens, classifyNetworkError };
})();

/* ---------------------------------------------------------------------
 * 6. RENDER — markdown → sanitized HTML, message elements, lazy upgrade
 * ------------------------------------------------------------------- */
const Render = (() => {
  const { marked, DOMPurify, hljs } = window.AbliVendor || {};
  const haveMd = !!(marked && DOMPurify);

  if (haveMd) {
    marked.setOptions({ gfm: true, breaks: true });
    marked.use({
      renderer: {
        code({ text, lang }) {
          const language = (lang || '').trim().split(/\s+/)[0].toLowerCase();
          let html;
          if (hljs && language && hljs.getLanguage(language)) {
            try { html = hljs.highlight(text, { language, ignoreIllegals: true }).value; } catch (e) { html = escapeHtml(text); }
          } else html = escapeHtml(text);
          // The copy button is added after sanitization (DOMPurify strips buttons from model output).
          return '<pre><div class="codebar"><span>' + escapeHtml(language || 'text') + '</span></div><code class="hljs' + (language ? ' language-' + escapeHtml(language) : '') + '">' + html + '</code></pre>';
        },
        // Images in model output are never loaded (tracking pixels); show them as links instead.
        image({ href, text }) {
          return '<a href="' + escapeHtml(href) + '" class="imglink">[image: ' + escapeHtml(text || href) + ']</a>';
        },
      },
    });
    DOMPurify.addHook('afterSanitizeAttributes', (node) => {
      if (node.tagName === 'A') {
        const href = node.getAttribute('href') || '';
        if (!/^(https?:|mailto:)/i.test(href)) node.removeAttribute('href');
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer nofollow');
      }
    });
  }
  const PURIFY = {
    USE_PROFILES: { html: true },
    FORBID_TAGS: ['style', 'img', 'picture', 'source', 'svg', 'math', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'textarea', 'select', 'link', 'meta', 'base', 'video', 'audio', 'template'],
    FORBID_ATTR: ['style', 'srcset', 'ping', 'formaction', 'background', 'poster'],
    ALLOW_DATA_ATTR: false,
  };
  function md(text) {
    if (!haveMd) return '<div class="plain">' + escapeHtml(text) + '</div>';
    let html;
    try { html = marked.parse(text || ''); } catch (e) { html = '<p>' + escapeHtml(text) + '</p>'; }
    return DOMPurify.sanitize(html, PURIFY);
  }

  /* Lazy markdown upgrade: far-away messages render as plain text and are upgraded when near the viewport. */
  let io = null;
  function observer() {
    if (io || !('IntersectionObserver' in window)) return io;
    io = new IntersectionObserver((entries) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        io.unobserve(en.target);
        upgrade(en.target);
      }
    }, { root: $('#messages'), rootMargin: '900px 0px' });
    return io;
  }
  function upgrade(el) {
    const body = $('.body-slot', el);
    if (!body || body.dataset.full === '1') return;
    const node = Sessions.node(el.dataset.id);
    if (!node) return;
    renderBody(body, node, true);
  }
  function renderBody(body, node, full) {
    if (node.role === 'user') {
      body.innerHTML = '';
      const div = document.createElement('div'); div.className = 'plain'; div.textContent = node.content || '';
      body.appendChild(div); body.dataset.full = '1';
      return;
    }
    if (full) {
      body.innerHTML = '<div class="md">' + md(node.content || '') + '</div>';
      for (const bar of body.querySelectorAll('.codebar')) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'copycode'; b.textContent = 'Copy'; b.setAttribute('aria-label', 'Copy code'); bar.appendChild(b);
      }
      body.dataset.full = '1';
    } else {
      body.innerHTML = '';
      const div = document.createElement('div'); div.className = 'plain'; div.textContent = node.content || '';
      body.appendChild(div); body.dataset.full = '0';
    }
  }

  const ICON = (id) => '<svg aria-hidden="true"><use href="#' + id + '"/></svg>';

  /** Build (or rebuild) the element for a node. `full` = render markdown now. */
  function messageEl(node, ctx, full) {
    const el = document.createElement('article');
    el.className = 'msg ' + node.role + (ctx.notSent ? ' notsent' : '');
    el.dataset.id = node.id;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (node.status === 'error' ? ' error' : '');
    // Thinking block
    if (node.role === 'assistant' && node.reasoning && Settings.data.showThinking) {
      const d = document.createElement('details'); d.className = 'think';
      d.innerHTML = '<summary>Thinking' + (node.status === 'streaming' && !node.content ? '…' : '') + '</summary><div class="body"></div>';
      $('.body', d).textContent = node.reasoning;
      if (node.status === 'streaming' && !node.content) d.open = true;
      bubble.appendChild(d);
    }
    if (node.role === 'user' && node.images && node.images.length) {
      const att = document.createElement('div'); att.className = 'attachments';
      for (const src of node.images) { const img = document.createElement('img'); img.src = src; img.alt = 'attached image'; img.loading = 'lazy'; att.appendChild(img); }
      bubble.appendChild(att);
    }
    const body = document.createElement('div'); body.className = 'body-slot';
    renderBody(body, node, full);
    if (node.status === 'streaming') body.classList.add('cursor');
    bubble.appendChild(body);
    if (node.status === 'error' || node.status === 'partial') {
      const er = document.createElement('div'); er.className = 'errline';
      er.innerHTML = '<span>' + escapeHtml(node.status === 'partial' ? 'Stopped' + (node.error ? ' — ' + node.error : '') : (node.error || 'Failed')) + '</span>' +
        '<button type="button" class="btn small" data-act="retry">Retry</button>' +
        (node.errorBody ? '<button type="button" class="btn small" data-act="details">Details</button>' : '');
      bubble.appendChild(er);
    }
    el.appendChild(bubble);
    // Meta line
    const meta = document.createElement('div'); meta.className = 'meta';
    const parts = [];
    if (node.usage) {
      parts.push('in ' + fmtK(node.usage.input) + ' · out ' + fmtK(node.usage.output));
      const cost = Sessions.costOf(node.model, node.usage);
      if (cost !== null) parts.push(fmtMoney(cost));
    }
    if (node.role === 'assistant' && node.model) parts.push(shortModel(node.model));
    if (node.duration) parts.push((node.duration / 1000).toFixed(1) + 's');
    if (node.finish === 'length') parts.push('cut off (max tokens)');
    meta.textContent = parts.join(' · ');
    if (parts.length) el.appendChild(meta);
    // Actions
    const act = document.createElement('div'); act.className = 'actions';
    let html = '';
    if (ctx.siblings > 1) {
      html += '<span class="nav"><button type="button" data-act="prev" aria-label="Previous version">‹</button><span>' + (ctx.index + 1) + '/' + ctx.siblings + '</span><button type="button" data-act="next" aria-label="Next version">›</button></span>';
    }
    html += '<button type="button" data-act="copy" aria-label="Copy message">' + ICON('i-copy') + '</button>';
    if (node.role === 'user') html += '<button type="button" data-act="edit" aria-label="Edit message">' + ICON('i-edit') + '</button>';
    else html += '<button type="button" data-act="regen" aria-label="Regenerate">' + ICON('i-redo') + '</button>';
    html += '<button type="button" data-act="branch" aria-label="Branch into a new chat from here">' + ICON('i-branch') + '</button>';
    act.innerHTML = html;
    el.appendChild(act);
    return el;
  }

  return { md, messageEl, observer, upgrade, renderBody };
})();

/* ---------------------------------------------------------------------
 * 7. SESSIONS — chats, message trees, branches, context accounting,
 *                titles, export / import
 * ------------------------------------------------------------------- */
const State = {
  chat: null,        // meta record
  tree: null,        // { id, nodes, head, sendFrom }
  path: [],          // active path (array of nodes, excluding root)
  stream: null,      // { controller, nodeId }
  draftImages: [],   // data URLs waiting in the composer
  chats: [],         // drawer list (meta records)
  est: new Map(),    // nodeId -> { len, tok }
  lastTokenInfo: null,
};

const Sessions = (() => {
  const ROOT = 'root';

  function newTree(id) { return { id, nodes: { [ROOT]: { id: ROOT, role: 'root', children: [], activeChild: null } }, sendFrom: null }; }
  function node(id) { return State.tree && State.tree.nodes[id]; }
  function computePath(tree = State.tree) {
    const out = [];
    let cur = tree.nodes[ROOT];
    while (cur && cur.activeChild && tree.nodes[cur.activeChild]) { cur = tree.nodes[cur.activeChild]; out.push(cur); }
    return out;
  }
  function refreshPath() { State.path = computePath(); return State.path; }
  function sendablePath() {
    const p = State.path;
    const from = State.tree && State.tree.sendFrom;
    if (!from) return p;
    const i = p.findIndex((n) => n.id === from);
    return i >= 0 ? p.slice(i) : p;
  }

  /* ---- persistence (batched during streaming) ---- */
  let saveTimer = null, savePending = false;
  function touchMeta(bump) {
    const c = State.chat; if (!c) return;
    if (bump) c.updatedAt = now();
    const p = State.path;
    const lastText = [...p].reverse().find((n) => n.content);
    c.preview = lastText ? lastText.content.slice(0, 90).replace(/\s+/g, ' ') : '';
    c.msgCount = p.length;
  }
  /** Keep the drawer's list entry pointing at the live meta object. */
  function syncList(meta) {
    const i = State.chats.findIndex((c) => c.id === meta.id);
    if (i >= 0) State.chats[i] = meta; else State.chats.unshift(meta);
  }
  async function saveNow(bump = true) {
    clearTimeout(saveTimer); saveTimer = null; savePending = false;
    if (!State.chat || !State.tree) return;
    touchMeta(bump);
    syncList(State.chat);
    await Store.put('chats', State.chat);
    await Store.put('trees', State.tree);
    UI.refreshDrawerItem(State.chat);
  }

  window.addEventListener('error', (ev) => error('Uncaught: ' + (ev.message || ev.error), ev.error && ev.error.stack));
  window.addEventListener('unhandledrejection', (ev) => { const r = ev.reason; error('Unhandled: ' + (r && r.message || r), r && (r.body || r.stack)); });
  return { data, load, beginRequest, error, environment, report };
})();

function toast(message, kind = '', { action, onAction, ms } = {}) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.setAttribute('role', 'status');
  el.innerHTML = '<span></span>' + (action ? '<button type="button"></button>' : '');
  $('span', el).textContent = redact(message);
  if (action) { const b = $('button', el); b.textContent = action; b.onclick = () => { el.remove(); onAction && onAction(); }; }
  box.appendChild(el);
  const ttl = ms || (kind === 'err' ? 7000 : 3200);
  setTimeout(() => el.remove(), ttl);
  return el;
}

  close(v = '') { const d = this.el(); d.returnValue = v; d.close(v); },

  let searchQuery = '', searchContentHits = new Map();

<script id="relay-src" type="text/plain">
/*
 * Unchained relay — a Cloudflare Worker that forwards requests from the
 * Unchained web app to the abliteration.ai API, for browsers that are blocked
 * by CORS from calling the API directly.
 *
 * No npm, no build step: paste this whole file into the Cloudflare dashboard
 * editor (Workers & Pages → Create → Worker → Edit code) and tap Deploy.
 *
 * Then, in the Worker's Settings → Variables and Secrets, add:
 *   ABLI_API_KEY     (Secret)  your real abliteration.ai API key
 *   RELAY_TOKEN      (Secret)  the access token from the app's Settings → "Generate token"
 *   ALLOWED_ORIGINS  (Text)    the app's address, e.g. https://you.github.io/unchained-llm-mobile-console/
 *                              (a full URL with a path is fine; it is reduced to the origin;
 *                               several origins may be separated by commas or spaces)
 *   UPSTREAM         (Text)    optional, defaults to https://api.abliteration.ai
 *
 * Behaviour:
 *   - Proxies only /v1/chat/completions, /v1/models and /v1/messages/count_tokens.
 *   - The phone authenticates with "Authorization: Bearer <RELAY_TOKEN>"; the worker swaps
 *     in the real API key, which never leaves Cloudflare.
 *   - Streams SSE straight through without buffering.
 *   - Refuses other origins, bad tokens, other paths and other methods.
 *   - GET / (opening the worker URL in a browser) shows a status page that says whether
 *     each secret/variable is set, without revealing any value.
 */

const ALLOWED_PATHS = new Set([
  '/v1/chat/completions',
  '/v1/models',
  '/v1/messages/count_tokens',
]);

const DEFAULT_UPSTREAM = 'https://api.abliteration.ai';

/** Reduce a pasted value (maybe a full URL with a path) to its origin. */
function toOrigin(value) {
  const v = String(value || '').trim();
  if (!v) return '';
  try {
    const url = new URL(v.includes('://') ? v : 'https://' + v);
    return url.origin.toLowerCase();
  } catch (e) {
    return '';
  }
}

function parseAllowedOrigins(env) {
  const raw = String(env.ALLOWED_ORIGINS || '');
  const list = raw.split(/[\s,]+/).map(toOrigin).filter(Boolean);
  return new Set(list);
}

/** Constant-time string comparison so token checks don't leak timing. */
function safeEqual(a, b) {
  const enc = new TextEncoder();
  const x = enc.encode(String(a || ''));
  const y = enc.encode(String(b || ''));
  if (x.length !== y.length) return false;
  let diff = 0;
  for (let i = 0; i < x.length; i++) diff |= x[i] ^ y[i];
  return diff === 0;
}

function corsHeaders(origin) {
  return {
    'Access-Control-Allow-Origin': origin,
    'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
    'Access-Control-Allow-Headers': 'Authorization, Content-Type, Accept, X-Requested-With',
    'Access-Control-Expose-Headers': 'Content-Type, X-Relay',
    'Access-Control-Max-Age': '86400',
    'Vary': 'Origin',
  };
}

function json(status, body, extra = {}) {
  return new Response(JSON.stringify(body), {
    status,
    headers: { 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store', ...extra },
  });
}

function statusPage(env) {
  const set = (name) => (env[name] && String(env[name]).length > 0 ? '✅ set' : '❌ not set');
  const origins = [...parseAllowedOrigins(env)];
  const upstream = toOrigin(env.UPSTREAM) || DEFAULT_UPSTREAM;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Unchained relay</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}
code{background:#222;padding:.1em .3em;border-radius:4px}li{margin:.3rem 0}</style></head><body>
<h1>Unchained relay</h1><p>This Worker is running. Nothing secret is shown here.</p>
<ul>
<li><code>ABLI_API_KEY</code> (secret): ${set('ABLI_API_KEY')}</li>
<li><code>RELAY_TOKEN</code> (secret): ${set('RELAY_TOKEN')}</li>
<li><code>ALLOWED_ORIGINS</code>: ${origins.length ? '✅ ' + esc(origins.join(', ')) : '❌ not set'}</li>
<li><code>UPSTREAM</code>: ${esc(upstream)}${env.UPSTREAM ? '' : ' (default)'}</li>
</ul>
<p>Allowed paths: <code>/v1/chat/completions</code>, <code>/v1/models</code>, <code>/v1/messages/count_tokens</code>.</p>
<p>In the app, set the base URL to this Worker's address followed by <code>/v1</code> and paste your access token.</p>
</body></html>`;
  return new Response(html, { status: 200, headers: { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' } });
}

export default {
  async fetch(request, env) {
    const url = new URL(request.url);
    const path = url.pathname.replace(/\/+$/, '') || '/';
    const origin = request.headers.get('Origin') || '';
    const allowed = parseAllowedOrigins(env);
    const originOk = origin && allowed.has(toOrigin(origin));

    // Status page: a plain browser visit with no Origin header.
    if (path === '/' && request.method === 'GET') return statusPage(env);

    if (!ALLOWED_PATHS.has(path)) {
      return json(404, { error: { message: 'Not proxied: ' + path, type: 'relay_not_found' } }, originOk ? corsHeaders(origin) : {});
    }

    if (request.method === 'OPTIONS') {
      if (!originOk) return new Response(null, { status: 403 });
      return new Response(null, { status: 204, headers: corsHeaders(origin) });
    }

    if (!originOk) {
      return json(403, { error: { message: 'Origin not allowed by this relay (check ALLOWED_ORIGINS)', type: 'relay_origin' } });
    }

    const cors = corsHeaders(origin);
    if (!env.ABLI_API_KEY || !env.RELAY_TOKEN) {
      return json(503, { error: { message: 'Relay not configured: set the ABLI_API_KEY and RELAY_TOKEN secrets', type: 'relay_config' } }, cors);
    }

    const auth = request.headers.get('Authorization') || '';
    const token = auth.startsWith('Bearer ') ? auth.slice(7).trim() : '';
    if (!token || !safeEqual(token, env.RELAY_TOKEN)) {
      return json(401, { error: { message: 'Bad relay token', type: 'relay_auth' } }, cors);
    }

    const expectedMethod = path === '/v1/models' ? 'GET' : 'POST';
    if (request.method !== expectedMethod) {
      return json(405, { error: { message: 'Method not allowed', type: 'relay_method' } }, { ...cors, Allow: expectedMethod });
    }

    const upstreamBase = toOrigin(env.UPSTREAM) || DEFAULT_UPSTREAM;
    const upstreamUrl = upstreamBase + path + url.search;
    const headers = new Headers();
    headers.set('Authorization', 'Bearer ' + env.ABLI_API_KEY);
    headers.set('Accept', request.headers.get('Accept') || '*/*');
    const ct = request.headers.get('Content-Type');
    if (ct) headers.set('Content-Type', ct);
    headers.set('User-Agent', 'unchained-relay/1.0');

    let upstream;
    try {
      upstream = await fetch(upstreamUrl, {
        method: request.method,
        headers,
        body: request.method === 'POST' ? request.body : undefined,
        redirect: 'manual',
      });
    } catch (e) {
      return json(502, { error: { message: 'Relay could not reach the API: ' + (e && e.message ? e.message : String(e)), type: 'relay_upstream' } }, cors);
    }

    // Pass the body through untouched (streaming), copy content headers, add CORS.
    const out = new Headers();
    for (const name of ['content-type', 'cache-control', 'x-request-id']) {
      const v = upstream.headers.get(name);
      if (v) out.set(name, v);
    }
    out.set('X-Relay', 'unchained');
    out.set('X-Accel-Buffering', 'no');
    for (const [k, v] of Object.entries(cors)) out.set(k, v);
    return new Response(upstream.body, { status: upstream.status, statusText: upstream.statusText, headers: out });
  },
};
</script>
